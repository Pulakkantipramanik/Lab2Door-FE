<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand">
      <h1>Lab2Door</h1>
      <p>Diagnostic tests, booked at your doorstep</p>
    </div>

    <h2>Login</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

    <p class="switch-link">New here? <a routerLink="/signup">Create an account</a></p>
  </div>
</div>
